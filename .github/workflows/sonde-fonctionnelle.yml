name: Sonde fonctionnelle

# Appelle réellement les outils du service déployé et exige de chaque réponse
# sa provenance officielle et sa datation explicite — dont
# applicable_at_as_of_date à la lecture d'un article.
#
# Déclenchement manuel uniquement, et c'est délibéré : chaque exécution
# consomme le quota PISTE de la clé utilisée. Elle se lance après un
# déploiement, après un incident, ou avant une publication.
#
# Authentification : une clé personnelle pk1.… assemblée sur la page /cle du
# service avec les identifiants PISTE de la personne qui sonde, stockée dans
# le secret de dépôt PANDECTE_PROBE_KEY. Pour la révoquer : régénérer le
# Client Secret sur PISTE. Elle ne passe jamais par une ligne de commande,
# visible dans la liste des processus du runner.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL complète du endpoint MCP à sonder (https://…/mcp)"
        required: true

permissions:
  contents: read

# Deux exécutions simultanées consommeraient le quota en parallèle et
# pourraient se déclencher mutuellement une limite de débit.
concurrency:
  group: sonde-fonctionnelle
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Installer le SDK MCP
        run: python -m pip install -r requirements-mcp.txt

      - name: Vérifier la présence de la clé
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.PANDECTE_PROBE_KEY }}
        run: |
          if [ -z "$MCP_ACCESS_TOKEN" ]; then
            echo "::error::secret PANDECTE_PROBE_KEY absent : assembler une clé sur /cle et l'enregistrer dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Sonder les outils
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.PANDECTE_PROBE_KEY }}
        run: python tests/check_live_tools.py "${{ inputs.url }}"
