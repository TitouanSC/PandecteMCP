# Blueprint Render de PandecteMCP — voir docs/deployment.md.
#
# Un seul service web Docker, sans disque : le serveur ne stocke rien.
# Chaque utilisateur se connecte avec SES identifiants PISTE (page
# « Connexion PISTE ») ; ils voyagent chiffrés dans le jeton que garde son
# assistant. Aucun identifiant PISTE n'est configuré ici.
#
# Offre « free » : 0 €, mais le service s'endort après une période sans
# requête et le premier appel suivant attend son réveil. Passer à
# « starter » pour un service toujours éveillé. Région Francfort (UE).
services:
  - type: web
    name: pandecte-mcp
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Branche de déploiement : à repasser sur main après la fusion.
    branch: connexion-piste
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      # URL publique du service, sans /mcp : https://<nom>.onrender.com
      - key: MCP_PUBLIC_URL
        sync: false
      # Clé de scellement des jetons, tirée au hasard par Render. La changer
      # déconnecte tous les utilisateurs (ils se reconnectent simplement).
      - key: PANDECTE_SEAL_KEY
        generateValue: true
      - key: LEGIFRANCE_ENV
        value: prod
      - key: JUDILIBRE_ENV
        value: prod
      # -- Adresse IP cliente (limite de débit par IP) ------------------------
      # À vérifier au premier déploiement avec /diagnostic-ip, puis passer
      # MCP_IP_DIAGNOSTIC à false. Voir docs/deployment.md.
      - key: MCP_TRUSTED_PROXY_HOPS
        value: "1"
      - key: MCP_IP_DIAGNOSTIC
        value: "true"
